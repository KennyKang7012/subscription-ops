name: Deploy to GitHub Pages

# 只在 main 有新 commit 時部署；也可以在 Actions 頁面手動觸發。
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要這三個權限（OIDC 由 id-token 提供）。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一份部署，但不要取消已經在跑的那份（避免站台中斷在舊版）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安裝依賴
        run: npm ci

      # 型別或測試沒過就不要部署，寧可網站停在上一版
      - name: 型別檢查
        run: npm run typecheck

      - name: 單元測試
        run: npm test

      - name: 建置
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
